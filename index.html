<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121212" />
<meta name="description" content="یادآور کارها - اپلیکیشن مدیریت وظایف با تقویم شمسی، بدون بک‌اند، قابل نصب" />
<title>یادآور کارها</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./assets/icons/favicon.png" />
<link rel="apple-touch-icon" href="./assets/icons/favicon.png" />
<link rel="stylesheet" href="/assets/fonts/Vazirmatn-font-face.css" />
<link rel="stylesheet" href="./css/variables.css" />
<link rel="stylesheet" href="./css/base.css" />
<link rel="stylesheet" href="./css/layout.css" />
<link rel="stylesheet" href="./css/components.css" />
<link rel="stylesheet" href="./css/responsive.css" />
</head>
<body data-theme="dark">
<div class="app-shell">
  <header class="mobile-topbar">
    <span class="mobile-topbar__title">یادآور کارها</span>
    <button class="theme-toggle" id="theme-toggle-mobile" aria-label="تغییر تم"><span class="theme-toggle__knob"></span></button>
  </header>

  <main class="main-content" id="view-container"></main>

  <nav class="bottom-nav">
    <div class="bottom-nav__items">
      <button class="bottom-nav__item" data-route="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4M2 12l3.09 6.26L2 22l6.91-1.86L12 22M2 12a10 10 0 1 0 10-10"/></svg>
        <span>کارها</span>
      </button>
      <button class="bottom-nav__item" data-route="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
        <span>تقویم</span>
      </button>
      <button class="bottom-nav__item fab" id="fab-add">
        <span class="bottom-nav__fab-circle"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg></span>
      </button>
      <button class="bottom-nav__item" id="fab-add-list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="19" cy="17" r="3"/><path d="M19 16v2M18 17h2"/></svg>
        <span>لیست جدید</span>
      </button>
      <button class="bottom-nav__item" data-route="about">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>درباره ما</span>
      </button>
    </div>
    <div class="bottom-nav__brand">
      <button class="theme-toggle" id="theme-toggle-desktop" aria-label="تغییر تم"><span class="theme-toggle__knob"></span></button>
      <span class="bottom-nav__brand-title">یادآور کارها</span>
    </div>
  </nav>
</div>

<div class="overlay" id="sheet-overlay"></div>
<div class="toast" id="toast"></div>

<!-- Update notification banner -->
<div id="updateNotification" class="card" style="display:none; margin: 16px;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div>
      <strong>نسخه جدید آماده است</strong>
      <div style="font-size: 0.85rem; color: #666;">
        برای اعمال به‌روزرسانی، برنامه را راه‌اندازی مجدد کنید.
      </div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button id="dismissUpdate" class="btn btn--outline" style="padding: 6px 10px;">بعداً</button>
      <button id="updateButton" class="btn btn--primary" style="padding: 6px 10px;">راه‌اندازی مجدد</button>
    </div>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
